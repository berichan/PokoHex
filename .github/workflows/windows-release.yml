name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PokoHex.slnx

      - name: Build
        run: dotnet build PokoHex.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PokoHex.Tests/PokoHex.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

      - name: Publish Windows app
        run: >-
          dotnet publish PokoHex/PokoHex.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create release ZIP
        run: |
          Copy-Item -LiteralPath LICENSE.txt -Destination artifacts/publish/LICENSE.txt
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/PokoHex-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokoHex-win-x64
          path: artifacts/publish/
          if-no-files-found: error

      - name: Attach ZIP to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" artifacts/PokoHex-win-x64.zip --clobber
